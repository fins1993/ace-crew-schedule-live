<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ace Schedule">
<title>Ace Crew Schedule</title>
<style>
:root{--bg:#f4f3ef;--card:#fff;--ink:#1d1d1b;--mut:#6b6b66;--line:#dcdad3;--acc:#1f6f43;--acc2:#e7f2eb;--warn:#b3261e;--warnbg:#fbe9e7;--chg:#fff4cc;--tent:#eef1f8}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.sm{padding:2px 8px;font-size:13px}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;width:100%}
.hide{display:none!important}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0 12px 0 0}
header .sp{flex:1}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#login{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px}
#login h2{margin:0 0 14px}
#login label{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}
.err{color:var(--warn);font-size:13px;margin-top:8px;min-height:18px}
/* admin layout */
#admin{display:grid;grid-template-columns:1fr 300px;gap:12px;padding:12px}
@media(max-width:900px){#admin{grid-template-columns:1fr}}
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.crew{flex:0 0 250px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.crew .row{margin:5px 0}
.crew .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin-bottom:2px}
.crew .head{display:flex;gap:6px}
.crew .head input{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.chip{background:var(--acc2);border-radius:12px;padding:2px 8px;font-size:13px;display:inline-flex;gap:4px;align-items:center}
.chip.bad{background:var(--warnbg);color:var(--warn)}
.chip b{cursor:pointer;font-weight:400;opacity:.6}
.job{display:grid;grid-template-columns:1fr 1fr auto;gap:4px;margin-bottom:4px}
.warnline{color:var(--warn);font-size:12px}
.side .panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.side h3{margin:0 0 6px;font-size:14px}
.feed{max-height:340px;overflow:auto;font-size:13px}
.feed div{border-bottom:1px solid var(--line);padding:4px 0}
.feed .t{color:var(--mut);font-size:11px}
.cnotes{border-top:1px dashed var(--line);margin-top:8px;padding-top:6px;font-size:13px}
.cnotes img{max-width:100%;border-radius:6px;margin-top:4px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.toolbar input[type=date]{width:auto}
table{border-collapse:collapse;width:100%;background:#fff}
td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left;font-size:14px}
#roster{padding:12px;max-width:900px}
#roster section{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.inline{display:flex;gap:6px;align-items:center}
.inline input,.inline select{width:auto}
/* crew phone view */
#crewv{max-width:560px;margin:0 auto;padding:10px}
.ccard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.ccard.changed{background:var(--chg);border-color:#e6c84d}
.ccard.tent{background:var(--tent)}
.ccard h3{margin:0 0 4px;font-size:18px}
.ccard .meta{color:var(--mut);font-size:14px;margin-bottom:8px}
.ccard dl{display:grid;grid-template-columns:90px 1fr;gap:4px 8px;margin:0}
.ccard dt{color:var(--mut);font-size:13px}
.ccard dd{margin:0;font-weight:500}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:#ddd;margin-left:6px;vertical-align:middle}
.badge.chg{background:#e6c84d}
.badge.tent{background:#c9d3ea}
.daylbl{font-weight:700;margin:16px 2px 6px}
.empty{color:var(--mut);text-align:center;padding:30px}
</style>
</head>
<body>

<div id="login">
  <h2>Ace Crew Schedule</h2>
  <label>Username (or email)</label>
  <input id="lu" autocomplete="username" autocapitalize="none">
  <label>PIN (or password)</label>
  <input id="lp" type="password" inputmode="numeric" autocomplete="current-password">
  <div style="margin-top:14px"><button class="pri" id="lbtn" style="width:100%">Sign in</button></div>
  <div class="err" id="lerr"></div>
</div>

<header id="hdr" class="hide">
  <h1>Ace Crew Schedule</h1>
  <div class="tabs" id="admintabs">
    <button data-tab="board" class="on">Board</button>
    <button data-tab="roster">Roster &amp; logins</button>
  </div>
  <div class="sp"></div>
  <span id="whoami" style="color:var(--mut)"></span>
  <button id="logout">Sign out</button>
</header>

<!-- ADMIN BOARD -->
<div id="admin" class="hide">
  <div>
    <div class="toolbar">
      <button id="prevday">&larr;</button>
      <input type="date" id="daypick">
      <button id="nextday">&rarr;</button>
      <strong id="daylabel"></strong>
      <span class="sp" style="flex:1"></span>
      <button id="copyprev">Copy previous day</button>
      <button class="pri" id="addcrew">+ Crew column</button>
    </div>
    <div class="board" id="board"></div>
  </div>
  <div class="side">
    <div class="panel"><h3>Unassigned today</h3><div class="chips" id="unassigned"></div></div>
    <div class="panel"><h3>OFF</h3><div class="chips" id="offchips"></div><select id="offadd"></select></div>
    <div class="panel"><h3>Service</h3><div class="chips" id="svcchips"></div><select id="svcadd"></select></div>
    <div class="panel"><h3>Vehicles not assigned</h3><div class="chips" id="vehfree"></div></div>
    <div class="panel"><h3>Live activity</h3><div class="feed" id="feed"></div></div>
  </div>
</div>

<!-- ROSTER -->
<div id="roster" class="hide">
  <section>
    <h3>People</h3>
    <div class="inline" style="margin-bottom:8px"><input id="newperson" placeholder="Name as it should appear, e.g. MIGUEL Jr"><button class="pri" id="addperson">Add</button></div>
    <table><thead><tr><th>Name</th><th>Login</th><th></th></tr></thead><tbody id="peoplerows"></tbody></table>
  </section>
  <section>
    <h3>Vehicles</h3>
    <div class="inline" style="margin-bottom:8px"><input id="newveh" placeholder="e.g. T-11 ISUZU"><button class="pri" id="addveh">Add</button></div>
    <div class="chips" id="vehlist"></div>
  </section>
  <section>
    <h3>Crew look-ahead</h3>
    <div class="inline">Crew can see <input id="lookahead" type="number" min="1" max="30" style="width:70px"> days (today counts as 1). Beyond tomorrow shows as tentative. <button id="savelook">Save</button></div>
  </section>
</div>

<!-- CREW PHONE VIEW -->
<div id="crewv" class="hide">
  <div class="tabs" id="crewtabs" style="display:flex;gap:6px;margin:6px 0 4px">
    <button data-v="today" class="on">Today</button>
    <button data-v="tomorrow">Tomorrow</button>
    <button data-v="week">This week</button>
  </div>
  <div id="crewlist"></div>
</div>

<script type="module">
// ============ CONFIG: paste your Firebase web-app config here ============
const firebaseConfig = {
  apiKey: "AIzaSyDKl6Z_EgKHp7nJdd4IaGuIQJw2B9BQmFQ",
  authDomain: "ace-crew-schedule-live.firebaseapp.com",
  projectId: "ace-crew-schedule-live",
  storageBucket: "ace-crew-schedule-live.firebasestorage.app",
  messagingSenderId: "294557215403",
  appId: "1:294557215403:web:85ea8b0bf47936559625ee"
};
const ADMIN_EMAIL = "fins1993@gmail.com";      // the one account allowed to set itself up as Admin
const USER_DOMAIN = "crew.ace-schedule.app";        // crew usernames become username@this (never emailed)
// ==========================================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, deleteDoc, collection, collectionGroup, query, where, orderBy, limit, onSnapshot, serverTimestamp, Timestamp, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dateOf = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (k, n) => { const d = dateOf(k); d.setDate(d.getDate()+n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const nice = k => dateOf(k).toLocaleDateString(undefined, {weekday:"long", month:"short", day:"numeric"});
const fmtTime = ts => ts?.toDate ? ts.toDate().toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "";

let me = null;            // users/{uid} doc + uid
let unsubs = [];
const stopAll = () => { unsubs.forEach(u => u()); unsubs = []; };

async function log(text, date) {
  try { await addDoc(collection(db, "logs"), { at: serverTimestamp(), uid: me.uid, name: me.name, date: date || null, text }); } catch (e) { console.warn("log failed", e); }
}

// ---------------- LOGIN ----------------
$("lbtn").onclick = async () => {
  $("lerr").textContent = "";
  let u = $("lu").value.trim(); const p = $("lp").value;
  if (!u || !p) { $("lerr").textContent = "Enter your username and PIN."; return; }
  const email = u.includes("@") ? u : `${u.toLowerCase().replace(/\s+/g,"")}@${USER_DOMAIN}`;
  try { await signInWithEmailAndPassword(auth, email, p); }
  catch (e) {
    const why = {
      "auth/invalid-credential": "That username/PIN didn't match.",
      "auth/wrong-password": "That username/PIN didn't match.",
      "auth/user-not-found": "No login with that name exists yet.",
      "auth/operation-not-allowed": "Email/Password sign-in isn't turned on in Firebase.",
      "auth/unauthorized-domain": "This web address isn't in Firebase's Authorized domains.",
      "auth/too-many-requests": "Too many tries. Wait a few minutes and try again."
    }[e.code] || "Sign-in failed.";
    $("lerr").textContent = `${why} (${e.code || e.message})`;
  }
};
$("lp").addEventListener("keydown", e => { if (e.key === "Enter") $("lbtn").click(); });
$("logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  stopAll();
  ["admin","roster","crewv","hdr"].forEach(id => $(id).classList.add("hide"));
  if (!user) { $("login").classList.remove("hide"); me = null; return; }
  $("login").classList.add("hide");
  let snap = await getDoc(doc(db, "users", user.uid));
  if (!snap.exists() && user.email?.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
    await setDoc(doc(db, "users", user.uid), { role: "admin", name: "Sal", username: "sal" });
    snap = await getDoc(doc(db, "users", user.uid));
  }
  if (!snap.exists()) { alert("This login has no access yet. Ask the office."); signOut(auth); return; }
  me = { uid: user.uid, ...snap.data() };
  $("hdr").classList.remove("hide");
  $("whoami").textContent = me.name + (me.role === "admin" ? " (Admin)" : "");
  if (me.role === "admin") startAdmin(); else startCrew();
});

// =============================== ADMIN ===============================
let people = {}, vehicles = {}, crews = {}, dayDoc = {}, dayNotes = [], curDay = todayKey(), lookahead = 7;
let pendingRender = false;

function startAdmin() {
  $("admintabs").classList.remove("hide");
  showTab("board");
  unsubs.push(onSnapshot(collection(db, "people"), s => { people = {}; s.forEach(d => people[d.id] = { id: d.id, ...d.data() }); renderAll(); renderRoster(); }));
  unsubs.push(onSnapshot(collection(db, "vehicles"), s => { vehicles = {}; s.forEach(d => vehicles[d.id] = { id: d.id, ...d.data() }); renderAll(); renderRoster(); }));
  unsubs.push(onSnapshot(doc(db, "settings", "app"), s => { lookahead = s.data()?.lookahead ?? 7; $("lookahead").value = lookahead; }));
  unsubs.push(onSnapshot(query(collection(db, "logs"), orderBy("at", "desc"), limit(60)), s => {
    $("feed").innerHTML = s.docs.map(d => { const x = d.data(); return `<div><div class="t">${esc(fmtTime(x.at))} · ${esc(x.name)}${x.date ? " · " + esc(x.date) : ""}</div>${esc(x.text)}</div>`; }).join("") || "<div class='t'>No activity yet.</div>";
  }));
  $("daypick").value = curDay;
  watchDay();
  unsubs.push(() => { dayUnsubs.forEach(u => u()); dayUnsubs = []; });
}

let dayUnsubs = [];
function watchDay() {
  dayUnsubs.forEach(u => u()); dayUnsubs = [];
  crews = {}; dayDoc = {}; dayNotes = [];
  $("daylabel").textContent = nice(curDay);
  dayUnsubs.push(onSnapshot(collection(db, "days", curDay, "crews"), s => { crews = {}; s.forEach(d => crews[d.id] = { id: d.id, ...d.data() }); renderAll(); }));
  dayUnsubs.push(onSnapshot(doc(db, "days", curDay), s => { dayDoc = s.data() || {}; renderAll(); }));
  dayUnsubs.push(onSnapshot(query(collection(db, "notes"), where("date", "==", curDay)), s => { dayNotes = s.docs.map(d => ({ id: d.id, ...d.data() })); renderAll(); }));
}

function showTab(t) {
  document.querySelectorAll("#admintabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  $("admin").classList.toggle("hide", t !== "board");
  $("roster").classList.toggle("hide", t !== "roster");
}
document.querySelectorAll("#admintabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
$("daypick").onchange = () => { if ($("daypick").value) { curDay = $("daypick").value; watchDay(); } };
$("prevday").onclick = () => { curDay = addDays(curDay, -1); $("daypick").value = curDay; watchDay(); };
$("nextday").onclick = () => { curDay = addDays(curDay, 1); $("daypick").value = curDay; watchDay(); };

const activePeople = () => Object.values(people).filter(p => p.active !== false).sort((a,b) => a.name.localeCompare(b.name));
const pname = id => people[id]?.name || "?";
const sortedCrews = () => Object.values(crews).sort((a,b) => (a.order ?? 0) - (b.order ?? 0));

function assignments() { // personId -> [crew labels]
  const m = {};
  sortedCrews().forEach(c => [c.foremanId, c.secondId, ...(c.crewIds || [])].filter(Boolean).forEach(id => (m[id] ||= []).push(c.label || "crew")));
  return m;
}

function personOptions(sel, blank = "—") {
  return `<option value="">${blank}</option>` + activePeople().map(p => `<option value="${p.id}" ${p.id === sel ? "selected" : ""}>${esc(p.name)}</option>`).join("");
}
function vehicleOptions(sel) {
  const names = Object.values(vehicles).map(v => v.name).sort();
  if (sel && !names.includes(sel)) names.unshift(sel);
  return `<option value="">—</option>` + names.map(n => `<option ${n === sel ? "selected" : ""}>${esc(n)}</option>`).join("");
}

function renderAll() {
  if (!me || me.role !== "admin") return;
  if ($("board").contains(document.activeElement) && document.activeElement.tagName !== "BUTTON") { pendingRender = true; return; }
  pendingRender = false;
  const asg = assignments();
  const vehUse = {}; sortedCrews().forEach(c => c.vehicle && (vehUse[c.vehicle] ||= []).push(c.label || "crew"));
  $("board").innerHTML = sortedCrews().map(c => crewCardHTML(c, asg, vehUse)).join("") || `<div class="empty">No crews for this day yet. Add a crew column or copy the previous day.</div>`;
  // side panels
  const off = dayDoc.off || [], svc = dayDoc.service || [];
  $("unassigned").innerHTML = activePeople().filter(p => !asg[p.id] && !off.includes(p.id) && !svc.includes(p.id)).map(p => `<span class="chip">${esc(p.name)}</span>`).join("") || "<span class='t' style='color:var(--mut)'>Everyone is placed.</span>";
  $("offchips").innerHTML = off.map(id => `<span class="chip">${esc(pname(id))}<b data-rmoff="${id}">×</b></span>`).join("");
  $("svcchips").innerHTML = svc.map(id => `<span class="chip">${esc(pname(id))}<b data-rmsvc="${id}">×</b></span>`).join("");
  $("offadd").innerHTML = personOptions("", "+ add to OFF");
  $("svcadd").innerHTML = personOptions("", "+ add to Service");
  $("vehfree").innerHTML = Object.values(vehicles).map(v => v.name).sort().filter(n => !vehUse[n]).map(n => `<span class="chip">${esc(n)}</span>`).join("");
}
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender && !$("board").contains(document.activeElement)) renderAll(); }, 50));

function crewCardHTML(c, asg, vehUse) {
  const dup = id => id && asg[id]?.length > 1;
  const chip = (id, field) => `<span class="chip ${dup(id) ? "bad" : ""}" title="${dup(id) ? "Also on: " + esc(asg[id].join(", ")) : ""}">${esc(pname(id))}<b data-rm="${field}" data-id="${id}" data-c="${c.id}">×</b></span>`;
  const warns = [];
  [c.foremanId, c.secondId, ...(c.crewIds||[])].filter(dup).forEach(id => warns.push(`${pname(id)} is on more than one crew`));
  if (c.vehicle && vehUse[c.vehicle]?.length > 1) warns.push(`${c.vehicle} is on more than one crew`);
  const notes = dayNotes.filter(n => n.crewId === c.id).sort((a,b) => (a.at?.seconds||0) - (b.at?.seconds||0));
  return `<div class="crew" data-c="${c.id}">
    <div class="head"><input data-f="label" value="${esc(c.label)}" placeholder="Crew / area"><input data-f="startTime" type="time" value="${esc(c.startTime)}" style="width:96px"></div>
    <div class="row"><div class="lbl">Lead Foreman</div><select data-f="foremanId">${personOptions(c.foremanId)}</select></div>
    <div class="row"><div class="lbl">Vehicle</div><select data-f="vehicle">${vehicleOptions(c.vehicle)}</select></div>
    <div class="row"><div class="lbl">Second</div><select data-f="secondId">${personOptions(c.secondId)}</select></div>
    <div class="row"><div class="lbl">Crew</div><div class="chips">${(c.crewIds||[]).map(id => chip(id, "crewIds")).join("")}</div><select data-add="crewIds">${personOptions("", "+ add crew")}</select></div>
    <div class="row"><div class="lbl">Outside labor (Yirah, Equa…)</div><input data-f="extraLabor" value="${esc(c.extraLabor)}" placeholder="e.g. 3 Yirah labor"></div>
    <div class="row"><div class="lbl">Job number</div><input data-f="jobNumber" value="${esc(c.jobNumber)}"></div>
    <div class="row"><div class="lbl">Jobs (name · location)</div>
      ${(c.jobs||[]).map((j,i) => `<div class="job"><input data-job="${i}" data-k="name" value="${esc(j.name)}" placeholder="Job name"><input data-job="${i}" data-k="location" value="${esc(j.location)}" placeholder="Location"><button class="sm" data-rmjob="${i}">×</button></div>`).join("")}
      <button class="sm" data-addjob="1">+ job</button></div>
    <div class="row"><div class="lbl">Notes</div><textarea data-f="notes" rows="2">${esc(c.notes)}</textarea></div>
    ${warns.map(w => `<div class="warnline">⚠ ${esc(w)}</div>`).join("")}
    ${notes.length ? `<div class="cnotes"><div class="lbl">From the crew</div>${notes.map(n => `<div><b>${esc(n.name)}</b> <span style="color:var(--mut);font-size:11px">${esc(fmtTime(n.at))}</span><br>${esc(n.text)}${n.photoUrl ? `<a href="${esc(n.photoUrl)}" target="_blank"><img src="${esc(n.photoUrl)}" loading="lazy"></a>` : ""}</div>`).join("")}</div>` : ""}
    <div style="display:flex;gap:6px;margin-top:8px"><button class="sm" data-move="-1">◀</button><button class="sm" data-move="1">▶</button><span style="flex:1"></span><button class="sm" data-delcrew="1">Delete crew</button></div>
  </div>`;
}

// Build the derived fields (names + who may read) every time a crew is saved
function derived(c) {
  const ids = [c.foremanId, c.secondId, ...(c.crewIds || [])].filter(Boolean);
  return {
    foremanName: c.foremanId ? pname(c.foremanId) : "",
    secondName: c.secondId ? pname(c.secondId) : "",
    crewNames: (c.crewIds || []).map(pname),
    memberUids: [...new Set(ids.map(id => people[id]?.uid).filter(Boolean))],
    date: curDay,
    dateTs: Timestamp.fromDate(dateOf(curDay)),
    updatedAt: serverTimestamp(),
    updatedBy: me.name
  };
}
async function saveCrew(id, patch, logText) {
  const next = { ...crews[id], ...patch };
  crews[id] = next;
  const { id: _omit, ...data } = next;
  await setDoc(doc(db, "days", curDay, "crews", id), { ...data, ...derived(next) });
  if (logText) log(`${next.label || "Crew"}: ${logText}`, curDay);
}
const fieldNames = { label: "crew name", startTime: "start time", foremanId: "lead foreman", vehicle: "vehicle", secondId: "second", extraLabor: "outside labor", jobNumber: "job number", notes: "notes" };
const show = (f, v) => (f === "foremanId" || f === "secondId") ? (v ? pname(v) : "none") : (v || "blank");

$("board").addEventListener("change", e => {
  const card = e.target.closest(".crew"); if (!card) return;
  const id = card.dataset.c, c = crews[id], t = e.target;
  if (t.dataset.f) {
    const f = t.dataset.f, old = c[f] || "", v = t.value;
    if (old === v) return;
    saveCrew(id, { [f]: v }, `${fieldNames[f]} ${show(f, old)} → ${show(f, v)}`);
  } else if (t.dataset.add) {
    if (!t.value) return;
    const list = [...(c.crewIds || [])]; if (!list.includes(t.value)) list.push(t.value);
    saveCrew(id, { crewIds: list }, `added ${pname(t.value)}`);
  } else if (t.dataset.job !== undefined) {
    const jobs = (c.jobs || []).map(j => ({ ...j })); jobs[+t.dataset.job][t.dataset.k] = t.value;
    saveCrew(id, { jobs }, `job updated: ${jobs.map(j => j.name).filter(Boolean).join(", ")}`);
  }
});
$("board").addEventListener("click", async e => {
  const t = e.target, card = t.closest(".crew"); if (!card) return;
  const id = card.dataset.c, c = crews[id];
  if (t.dataset.rm) { const list = (c.crewIds || []).filter(x => x !== t.dataset.id); saveCrew(id, { crewIds: list }, `removed ${pname(t.dataset.id)}`); }
  else if (t.dataset.addjob) saveCrew(id, { jobs: [...(c.jobs || []), { name: "", location: "" }] });
  else if (t.dataset.rmjob !== undefined) { const jobs = [...(c.jobs || [])]; const [gone] = jobs.splice(+t.dataset.rmjob, 1); saveCrew(id, { jobs }, `removed job ${gone?.name || ""}`); }
  else if (t.dataset.move) {
    const list = sortedCrews(); const i = list.findIndex(x => x.id === id), j = i + (+t.dataset.move);
    if (j < 0 || j >= list.length) return;
    const b = writeBatch(db);
    list.splice(j, 0, list.splice(i, 1)[0]);
    list.forEach((x, k) => b.update(doc(db, "days", curDay, "crews", x.id), { order: k }));
    await b.commit();
  }
  else if (t.dataset.delcrew) {
    if (!confirm(`Delete the ${c.label || "this"} crew column for ${nice(curDay)}?`)) return;
    await deleteDoc(doc(db, "days", curDay, "crews", id)); log(`deleted crew ${c.label || ""}`, curDay);
  }
});

$("addcrew").onclick = async () => {
  const order = sortedCrews().length;
  const ref1 = doc(collection(db, "days", curDay, "crews"));
  crews[ref1.id] = { id: ref1.id, order, label: "", startTime: "06:30", crewIds: [], jobs: [{ name: "", location: "" }] };
  await saveCrew(ref1.id, {}, "new crew column added");
  await ensureDayDoc();
};
async function ensureDayDoc() {
  await setDoc(doc(db, "days", curDay), { dateTs: Timestamp.fromDate(dateOf(curDay)) }, { merge: true });
}
$("copyprev").onclick = async () => {
  if (sortedCrews().length && !confirm("This day already has crews. Add the previous day's crews to it anyway?")) return;
  const from = addDays(curDay, -1);
  const s = await getDocs(collection(db, "days", from, "crews"));
  if (s.empty) { alert(`No crews found on ${nice(from)}.`); return; }
  const start = sortedCrews().length;
  for (const [k, d] of s.docs.entries()) {
    const x = d.data(); const r = doc(collection(db, "days", curDay, "crews"));
    crews[r.id] = { id: r.id, order: start + (x.order ?? k), label: x.label || "", startTime: x.startTime || "", foremanId: x.foremanId || "", vehicle: x.vehicle || "", secondId: x.secondId || "", crewIds: x.crewIds || [], extraLabor: x.extraLabor || "", jobNumber: x.jobNumber || "", jobs: x.jobs || [], notes: x.notes || "" };
    await saveCrew(r.id, {});
  }
  const p = (await getDoc(doc(db, "days", from))).data() || {};
  await setDoc(doc(db, "days", curDay), { dateTs: Timestamp.fromDate(dateOf(curDay)), off: p.off || [], service: p.service || [] }, { merge: true });
  log(`copied ${s.size} crews from ${from}`, curDay);
};

async function setList(field, list, text) {
  await setDoc(doc(db, "days", curDay), { dateTs: Timestamp.fromDate(dateOf(curDay)), [field]: list }, { merge: true });
  log(text, curDay);
}
$("offadd").onchange = e => { const v = e.target.value; if (v) setList("off", [...new Set([...(dayDoc.off || []), v])], `${pname(v)} marked OFF`); };
$("svcadd").onchange = e => { const v = e.target.value; if (v) setList("service", [...new Set([...(dayDoc.service || []), v])], `${pname(v)} on Service`); };
document.querySelector(".side").addEventListener("click", e => {
  const t = e.target;
  if (t.dataset.rmoff) setList("off", (dayDoc.off || []).filter(x => x !== t.dataset.rmoff), `${pname(t.dataset.rmoff)} removed from OFF`);
  if (t.dataset.rmsvc) setList("service", (dayDoc.service || []).filter(x => x !== t.dataset.rmsvc), `${pname(t.dataset.rmsvc)} removed from Service`);
});

// ---------------- ROSTER & LOGINS ----------------
function renderRoster() {
  if (!me || me.role !== "admin") return;
  $("peoplerows").innerHTML = Object.values(people).sort((a,b) => a.name.localeCompare(b.name)).map(p => `<tr>
    <td>${esc(p.name)}${p.active === false ? " <span class='badge'>inactive</span>" : ""}</td>
    <td>${p.uid ? `✓ <b>${esc(p.username)}</b>` : `<span class="inline"><input placeholder="username" data-un="${p.id}" style="width:110px"><input placeholder="6-digit PIN" data-pin="${p.id}" inputmode="numeric" maxlength="6" style="width:100px"><button class="sm" data-mklogin="${p.id}">Create login</button></span>`}</td>
    <td><button class="sm" data-toggle="${p.id}">${p.active === false ? "Reactivate" : "Deactivate"}</button></td></tr>`).join("");
  $("vehlist").innerHTML = Object.values(vehicles).sort((a,b) => a.name.localeCompare(b.name)).map(v => `<span class="chip">${esc(v.name)}<b data-rmveh="${v.id}">×</b></span>`).join("");
}
$("addperson").onclick = async () => {
  const n = $("newperson").value.trim(); if (!n) return;
  if (Object.values(people).some(p => p.name.toLowerCase() === n.toLowerCase())) { alert("That name is already on the roster."); return; }
  await addDoc(collection(db, "people"), { name: n, active: true }); $("newperson").value = ""; log(`added ${n} to roster`);
};
$("newperson").addEventListener("keydown", e => e.key === "Enter" && $("addperson").click());
$("addveh").onclick = async () => { const n = $("newveh").value.trim(); if (!n) return; await addDoc(collection(db, "vehicles"), { name: n }); $("newveh").value = ""; };
$("newveh").addEventListener("keydown", e => e.key === "Enter" && $("addveh").click());
$("roster").addEventListener("click", async e => {
  const t = e.target;
  if (t.dataset.rmveh) { if (confirm("Remove this vehicle from the list?")) await deleteDoc(doc(db, "vehicles", t.dataset.rmveh)); }
  if (t.dataset.toggle) { const p = people[t.dataset.toggle]; await updateDoc(doc(db, "people", p.id), { active: p.active === false }); }
  if (t.dataset.mklogin) {
    const pid = t.dataset.mklogin;
    const un = document.querySelector(`[data-un="${pid}"]`).value.trim().toLowerCase().replace(/\s+/g, "");
    const pin = document.querySelector(`[data-pin="${pid}"]`).value.trim();
    if (!/^[a-z0-9._-]{2,30}$/.test(un)) { alert("Username: letters/numbers only, no spaces."); return; }
    if (!/^\d{6}$/.test(pin)) { alert("PIN must be exactly 6 digits."); return; }
    try {
      // a second app instance creates the account without signing you out
      const secApp = initializeApp(firebaseConfig, "maker-" + Date.now());
      const secAuth = getAuth(secApp);
      const cred = await createUserWithEmailAndPassword(secAuth, `${un}@${USER_DOMAIN}`, pin);
      await signOut(secAuth);
      await setDoc(doc(db, "users", cred.user.uid), { role: "crew", name: people[pid].name, username: un, personId: pid });
      await updateDoc(doc(db, "people", pid), { uid: cred.user.uid, username: un });
      log(`created login "${un}" for ${people[pid].name}`);
      alert(`Login created.\nUsername: ${un}\nPIN: ${pin}\n\nGive these to ${people[pid].name}. Re-save any crews they're already on so they can see them.`);
    } catch (err) { alert(err.code === "auth/email-already-in-use" ? "That username is taken." : "Couldn't create login: " + err.message); }
  }
});
$("savelook").onclick = async () => {
  const n = Math.max(1, Math.min(30, parseInt($("lookahead").value) || 7));
  await setDoc(doc(db, "settings", "app"), { lookahead: n }); log(`crew look-ahead set to ${n} days`);
};

// =============================== CREW VIEW ===============================
let myCrews = [], myNotes = [], crewTab = "today";
const seenKey = () => "seen-" + me.uid;
function getSeen() { try { return JSON.parse(localStorage.getItem(seenKey()) || "{}"); } catch { return {}; } }
function setSeen(o) { try { localStorage.setItem(seenKey(), JSON.stringify(o)); } catch {} }

async function startCrew() {
  $("admintabs").classList.add("hide");
  $("crewv").classList.remove("hide");
  const st = await getDoc(doc(db, "settings", "app")).catch(() => null);
  const la = st?.data()?.lookahead ?? 7;
  const start = dateOf(todayKey());
  const end = new Date(start); end.setDate(end.getDate() + la); end.setMilliseconds(-1);
  unsubs.push(onSnapshot(query(collectionGroup(db, "crews"), where("memberUids", "array-contains", me.uid), where("dateTs", ">=", Timestamp.fromDate(start)), where("dateTs", "<=", Timestamp.fromDate(end))),
    s => { myCrews = s.docs.map(d => ({ id: d.id, ...d.data() })); renderCrew(); },
    err => { console.error(err); $("crewlist").innerHTML = `<div class="empty">Couldn't load your schedule. ${esc(err.message)}</div>`; }));
  unsubs.push(onSnapshot(query(collection(db, "notes"), where("memberUids", "array-contains", me.uid), where("date", ">=", todayKey())),
    s => { myNotes = s.docs.map(d => ({ id: d.id, ...d.data() })); renderCrew(); }, err => console.error(err)));
}
document.addEventListener("focusout", () => setTimeout(() => { if (me && me.role !== "admin" && !document.activeElement?.closest?.(".ccard")) renderCrew(); }, 300));
document.querySelectorAll("#crewtabs button").forEach(b => b.onclick = () => { crewTab = b.dataset.v; document.querySelectorAll("#crewtabs button").forEach(x => x.classList.toggle("on", x === b)); renderCrew(); });

function renderCrew() {
  // don't wipe a note or photo someone is in the middle of sending
  if (document.activeElement?.closest?.(".ccard")) return;
  if ([...document.querySelectorAll("#crewlist [data-note]")].some(x => x.value.trim()) || [...document.querySelectorAll("#crewlist [data-photo]")].some(x => x.files.length)) return;
  const t = todayKey(), tm = addDays(t, 1);
  let list = myCrews.filter(c => crewTab === "today" ? c.date === t : crewTab === "tomorrow" ? c.date === tm : true)
    .sort((a,b) => a.date.localeCompare(b.date) || (a.startTime || "").localeCompare(b.startTime || ""));
  const seen = getSeen();
  let html = "", lastDay = "";
  for (const c of list) {
    if (crewTab === "week" && c.date !== lastDay) { html += `<div class="daylbl">${esc(nice(c.date))}</div>`; lastDay = c.date; }
    const upd = c.updatedAt?.toMillis?.() || 0;
    const changed = seen[c.date + c.id] && upd > seen[c.date + c.id];
    const tent = c.date > tm;
    const notes = myNotes.filter(n => n.crewId === c.id && n.date === c.date).sort((a,b) => (a.at?.seconds||0) - (b.at?.seconds||0));
    html += `<div class="ccard ${changed ? "changed" : ""} ${tent ? "tent" : ""}" data-c="${c.id}" data-d="${c.date}" data-upd="${upd}">
      <h3>${esc(c.jobs?.map(j => j.name).filter(Boolean).join(" + ") || c.label || "Assignment")}${changed ? `<span class="badge chg">CHANGED</span>` : ""}${tent ? `<span class="badge tent">tentative</span>` : ""}</h3>
      <div class="meta">${esc(nice(c.date))} · Start ${esc(c.startTime || "TBD")}${c.label ? " · " + esc(c.label) : ""}</div>
      <dl>
        ${(c.jobs || []).filter(j => j.name || j.location).map(j => `<dt>Job</dt><dd>${esc(j.name)}${j.location ? " — " + esc(j.location) : ""}</dd>`).join("")}
        ${c.jobNumber ? `<dt>Job #</dt><dd>${esc(c.jobNumber)}</dd>` : ""}
        <dt>Foreman</dt><dd>${esc(c.foremanName || "—")}</dd>
        <dt>Vehicle</dt><dd>${esc(c.vehicle || "—")}</dd>
        ${c.secondName ? `<dt>Second</dt><dd>${esc(c.secondName)}</dd>` : ""}
        ${c.crewNames?.length ? `<dt>Crew</dt><dd>${esc(c.crewNames.join(", "))}</dd>` : ""}
        ${c.extraLabor ? `<dt>Labor</dt><dd>${esc(c.extraLabor)}</dd>` : ""}
        ${c.notes ? `<dt>Notes</dt><dd>${esc(c.notes)}</dd>` : ""}
      </dl>
      ${changed ? `<button class="sm" data-gotit="1" style="margin-top:8px">Got it</button>` : ""}
      <div class="cnotes">
        ${notes.map(n => `<div style="margin-bottom:6px"><b>${esc(n.name)}</b> <span style="color:var(--mut);font-size:11px">${esc(fmtTime(n.at))}</span><br>${esc(n.text)}${n.photoUrl ? `<img src="${esc(n.photoUrl)}" loading="lazy">` : ""}</div>`).join("")}
        <textarea rows="2" placeholder="Add a note for the office…" data-note="1"></textarea>
        <div style="display:flex;gap:6px;margin-top:6px;align-items:center"><label class="sm" style="border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#fff">📷 Photo<input type="file" accept="image/*" data-photo="1" class="hide"></label><span data-pname="1" style="font-size:12px;color:var(--mut);flex:1"></span><button class="pri sm" data-send="1">Send</button></div>
      </div>
    </div>`;
    if (!seen[c.date + c.id]) { seen[c.date + c.id] = upd || Date.now(); }
  }
  setSeen(seen);
  $("crewlist").innerHTML = html || `<div class="empty">${crewTab === "week" ? "Nothing scheduled for you yet." : "Nothing scheduled for you " + (crewTab === "today" ? "today" : "tomorrow") + " yet."}</div>`;
}

async function shrink(file) { // resize photos to ~1600px JPEG before upload
  const img = await createImageBitmap(file);
  const s = Math.min(1, 1600 / Math.max(img.width, img.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  return await new Promise(r => cv.toBlob(r, "image/jpeg", 0.8));
}
$("crewlist").addEventListener("change", e => {
  if (e.target.dataset.photo) { const card = e.target.closest(".ccard"); card.querySelector("[data-pname]").textContent = e.target.files[0]?.name || ""; }
});
$("crewlist").addEventListener("click", async e => {
  const t = e.target, card = t.closest(".ccard"); if (!card) return;
  const cid = card.dataset.c, date = card.dataset.d, c = myCrews.find(x => x.id === cid && x.date === date);
  if (t.dataset.gotit) { const s = getSeen(); s[date + cid] = +card.dataset.upd; setSeen(s); renderCrew(); }
  if (t.dataset.send) {
    const text = card.querySelector("[data-note]").value.trim();
    const file = card.querySelector("[data-photo]").files[0];
    if (!text && !file) return;
    t.disabled = true; t.textContent = "Sending…";
    try {
      let photoUrl = "";
      if (file) {
        const blob = await shrink(file);
        const r = ref(storage, `photos/${date}/${cid}/${Date.now()}-${me.uid}.jpg`);
        await uploadBytes(r, blob, { contentType: "image/jpeg" });
        photoUrl = await getDownloadURL(r);
      }
      await addDoc(collection(db, "notes"), { date, crewId: cid, uid: me.uid, name: me.name, text, photoUrl, memberUids: c.memberUids, at: serverTimestamp() });
      log(`note on ${c.label || "crew"}${file ? " (with photo)" : ""}: ${text || "photo"}`, date);
      card.querySelector("[data-note]").value = ""; card.querySelector("[data-photo]").value = "";
      document.activeElement.blur(); renderCrew();
    } catch (err) { alert("Couldn't send: " + err.message); t.disabled = false; t.textContent = "Send"; }
  }
});
</script>
